# Dependabot: opens PRs for security fixes as soon as an advisory lands,
# plus a weekly sweep of patch/minor updates. Merging is handled by
# .github/workflows/dependabot-auto-merge.yml.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
